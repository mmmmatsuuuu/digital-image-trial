<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>デジタルデータの魔法を体験しよう！ | 画像のデジタル化体験</title>
  <meta name="description" content="画像のデジタル化（バイナリデータ）の仕組みを一瞬で体験・学習できるWebアプリ" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ネオン系のアクセント表現（Tailwind だけでは書きにくい部分） */
    .neon-text {
      text-shadow: 0 0 10px rgba(34, 211, 238, 0.8), 0 0 30px rgba(168, 85, 247, 0.5);
    }
    .neon-border {
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.35), inset 0 0 12px rgba(168, 85, 247, 0.15);
    }
    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fade-in-up 0.4s ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-gray-900 text-gray-100 bg-[radial-gradient(ellipse_at_top,rgba(88,28,135,0.35),transparent_60%),radial-gradient(ellipse_at_bottom,rgba(8,145,178,0.25),transparent_60%)]">

  <div class="mx-auto max-w-3xl px-4 py-8 flex flex-col gap-8">

    <!-- 1. ヘッダー -->
    <header class="text-center">
      <p class="text-sm tracking-widest text-cyan-400 mb-2">DIGITAL IMAGE TRIAL</p>
      <h1 class="text-3xl sm:text-4xl font-extrabold neon-text bg-gradient-to-r from-cyan-300 via-purple-300 to-pink-300 bg-clip-text text-transparent">
        デジタルデータの魔法を<br class="sm:hidden">体験しよう！
      </h1>
      <p class="mt-3 text-sm text-gray-400">
        画像は数字（バイナリデータ）でできている。<br>
        数字を計算するだけで、画像は一瞬で変身するよ！
      </p>
    </header>

    <!-- 2. アップロードエリア -->
    <section class="rounded-2xl border-2 border-dashed border-cyan-500/60 bg-gray-800/60 p-6 text-center neon-border">
      <p class="mb-4 text-lg font-bold text-cyan-300">📷 まずは画像をえらぼう</p>
      <label for="file-input"
        class="inline-block cursor-pointer rounded-full bg-gradient-to-r from-cyan-500 to-purple-600 px-8 py-3 font-bold text-white shadow-lg transition hover:scale-105 hover:shadow-cyan-500/40 active:scale-95">
        画像をアップロード
      </label>
      <input type="file" id="file-input" accept="image/*" class="hidden" />
      <p id="upload-area" class="mt-3 text-xs text-gray-500">スマホならカメラで撮った写真も使えるよ</p>
    </section>

    <!-- 3. ワークスペース（Canvas） -->
    <section id="workspace" class="hidden rounded-2xl bg-gray-800/80 p-4 neon-border">
      <div class="flex justify-center">
        <canvas id="canvas" class="max-w-full rounded-lg shadow-2xl"></canvas>
      </div>
    </section>

    <!-- 4. コントロールエリア -->
    <section id="control-area" class="hidden">
      <p class="mb-3 text-center text-sm font-bold text-purple-300">✨ ボタンを押して魔法をかけよう ✨</p>
      <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
        <button data-effect="invert"
          class="rounded-xl bg-gray-800 border border-indigo-500/60 px-3 py-4 font-bold text-indigo-300 shadow transition hover:bg-indigo-900/40 hover:scale-105 active:scale-95">
          🌙<br>ダークモード
        </button>
        <button data-effect="mirror"
          class="rounded-xl bg-gray-800 border border-cyan-500/60 px-3 py-4 font-bold text-cyan-300 shadow transition hover:bg-cyan-900/40 hover:scale-105 active:scale-95">
          🪞<br>左右はんてん
        </button>
        <button data-effect="grayscale"
          class="rounded-xl bg-gray-800 border border-amber-500/60 px-3 py-4 font-bold text-amber-300 shadow transition hover:bg-amber-900/40 hover:scale-105 active:scale-95">
          ⏳<br>レトロ白黒
        </button>
        <button data-effect="glitch"
          class="rounded-xl bg-gray-800 border border-fuchsia-500/60 px-3 py-4 font-bold text-fuchsia-300 shadow transition hover:bg-fuchsia-900/40 hover:scale-105 active:scale-95">
          ⚡️<br>サイバーバグ
        </button>
      </div>
    </section>

    <!-- 5. 解説エリア（動的表示） -->
    <section id="explanation-area" class="hidden animate-fade-in-up rounded-2xl border-l-4 border-cyan-400 bg-gray-800/80 p-5 neon-border">
      <h2 id="explanation-title" class="mb-3 text-lg font-bold text-cyan-300"></h2>
      <div id="explanation-sections" class="flex flex-col gap-3"></div>
      <p class="mt-3 text-xs text-purple-300/80">💡 これが高校「情報Ⅰ」で学ぶ、デジタルデータの世界！</p>
    </section>

    <!-- 6. アクションエリア -->
    <section id="action-area" class="hidden flex flex-col items-center gap-3">
      <button id="save-button"
        class="w-full max-w-xs rounded-full bg-gradient-to-r from-emerald-500 to-cyan-600 px-8 py-3 font-bold text-white shadow-lg transition hover:scale-105 hover:shadow-emerald-500/40 active:scale-95">
        💾 加工した画像を保存する
      </button>
      <button id="reset-button"
        class="text-sm text-gray-400 underline underline-offset-4 transition hover:text-gray-200">
        🔄 さいしょの画像に戻す
      </button>
    </section>

    <footer class="pb-4 text-center text-xs text-gray-600">
      体験入学お土産サイト — 画像のデジタル化体験
    </footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
